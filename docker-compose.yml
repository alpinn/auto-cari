services:
  backend:
    build: ./apps/backend
    env_file: ./apps/backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./apps/frontend
    env_file: ./apps/frontend/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
